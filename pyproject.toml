[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-ai-agent"
version = "0.1.0"
description = "Educational Databricks multi-agent investment research POC"
requires-python = ">=3.11"
dependencies = [
  "databricks-sdk>=0.60.0",
  "mlflow>=3.0.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
